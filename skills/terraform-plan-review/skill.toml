# Per-skill machine-facing manifest (architecture.md §4.1, R16/R25).
# This file VENDORS with the skill into consumer repos so `skillrig verify`
# can check prerequisites offline wherever the skill lands.

name        = "terraform-plan-review"
version     = "1.4.0"
namespace   = "my-org"                  # reverse-DNS-ish namespacing
description = "Review a terraform plan for risk and drift."

# Deterministic discovery tags (R24, N6). Suggestion UX is v1; the DATA ships now.
tags = ["platform-team", "terraform", "aws"]

# Backing-CLI prerequisites (R15). DECLARED, not installed (R17) — skillrig
# verifies these; mise (or the developer's chosen tool) installs them.

# Private, co-located CLI: source points at THIS origin, so it resolves to the
# oxid-v* release stream built from cmd/oxid/ in this repo (architecture.md §8).
[[requires]]
tool    = "oxid"
version = ">=0.4.0"
source  = "my-org/my-skills"            # this origin; mise gh backend, oxid-v* tags
manager = "mise"                         # supported path; advisory

# Public CLI: provisioning is the developer's choice; mise is recommended.
[[requires]]
tool    = "terraform"
version = ">=1.6"
source  = "hashicorp/terraform"
manager = "mise"
